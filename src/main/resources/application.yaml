spring:
  application:
    name: home_medicine_tracker

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      max-lifetime: 1800000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25


  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    web:
      pageable:
        max-page-size: 200

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:24h}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.ilestegor.home_medicine_tracker: ${APP_LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: last
        max-length: 8192
        include-common-frames: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - db

---
spring:
  config:
    activate:
      on-profile: dev
#  jpa:
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true
#        highlight_sql: true
app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %clr(%kvp){faint}%n%wEx"
  level:
#    org.hibernate.orm.jdbc.bind: TRACE
    liquibase: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
