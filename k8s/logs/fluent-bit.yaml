service:
  flush: 1
  log_level: info

pipeline:
  inputs:
    - name: tail
      tag: kube.*
      path: /var/log/containers/medtracker-backend*_medtracker_backend-*.log
      multiline.parser: docker,cri
      db: /fluent-bit/state/tail.db
      read_from_head: true

  filters:
    - name: kubernetes
      match: kube.*
      kube_tag_prefix: kube.var.log.containers.
      use_tag_for_meta: true
      merge_log: true
      keep_log: false
      labels: false
      annotations: false

  outputs:
    - name: http
      match: kube.*
      host: victoria-logs.logging.svc.cluster.local
      port: 9428
      uri: '/insert/jsonline?_stream_fields=service.name,kubernetes.namespace_name,kubernetes.container_name&_msg_field=message&_time_field=@timestamp,fluentbit_time'
      format: json_lines
      json_date_key: fluentbit_time
      json_date_format: iso8601
