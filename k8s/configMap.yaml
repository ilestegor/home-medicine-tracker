apiVersion: v1
kind: ConfigMap
metadata:
  name: medtracker-config
  namespace: medtracker
data:
  POSTGRES_DB: medtracker
  POSTGRES_USER: medtracker
  DB_URL: jdbc:postgresql://postgres:5432/medtracker
  SERVER_PORT: "8080"
  JWT_TTL: 24h
  LIQUIBASE_ENABLED: "true"
  DB_POOL_MAX_SIZE: "10"
  DB_POOL_MIN_IDLE: "2"
  LOG_LEVEL: INFO
  APP_LOG_LEVEL: INFO