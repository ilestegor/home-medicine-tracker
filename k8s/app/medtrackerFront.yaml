apiVersion: v1
kind: Service
metadata:
  name: medtracker-front
  namespace: medtracker
spec:
  selector:
    app: medtracker-front
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medtracker-front
  namespace: medtracker
spec:
  selector:
    matchLabels:
      app: medtracker-front
  template:
    metadata:
      labels:
        app: medtracker-front
    spec:
      containers:
        - name: front
          image: medtracker-front:0.0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              port: http
              path: /
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: http
              path: /
            periodSeconds: 25
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
