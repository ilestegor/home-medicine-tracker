apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medtracker
  namespace: medtracker
spec:
  ingressClassName: nginx
  rules:
     - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: medtracker-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medtracker-front
                port:
                  number: 80